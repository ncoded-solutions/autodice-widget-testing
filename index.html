<!doctype html>
<!-- lang stays "en" on every page, French ones too, unless ?switch=soft (see src/App.tsx). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summit Motors</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
    <script
      src="https://dev.cdn.autodice.com/widget.js"
      data-widget-id="autodice_d7961c11-88c1-4da5-bd9b-33eea5abdded">
    </script>
    -->

    <!-- Which dealer's widget loads: the demo dealer by default, the 1,000-car test dealer with
      ?widget=test. The choice sticks for the tab (pages and reloads); ?widget=demo goes back.
      The embed tag sits in a <template> so it doesn't run on its own, while vite.config.ts's
      WIDGET_LOADER / WIDGET_ID still rewrite it for local runs; the script below copies it. -->
    <template id="miles-widget-embed">
      <script
        src="https://dev.cdn.autodice.com/widget.js"
        data-widget-id="autodice_f602c727-d12f-4e20-93c4-2b19bed07325">
      </script>
    </template>
    <script>
      (function () {
        var TEST_WIDGET_ID = 'autodice_c5393219-55f9-4b4a-9f9f-41ad08e28131';
        var requested = new URLSearchParams(window.location.search).get('widget');
        var choice = requested === 'test' || requested === 'demo' ? requested : null;
        try {
          if (choice) sessionStorage.setItem('demo-widget', choice);
          else choice = sessionStorage.getItem('demo-widget');
        } catch (error) {
          // Storage blocked: the URL alone decides.
        }
        var embed = document.getElementById('miles-widget-embed').content.querySelector('script');
        var script = document.createElement('script');
        if (embed.type) script.type = embed.type;
        script.src = embed.src;
        script.dataset.widgetId = choice === 'test' ? TEST_WIDGET_ID : embed.dataset.widgetId;
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
